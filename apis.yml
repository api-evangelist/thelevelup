name: LevelUp
description: >-
  LevelUp (thelevelup.com) was a mobile payments and loyalty platform that let consumers pay
  and earn rewards at local restaurants and businesses via a QR-code / mobile-order-ahead app,
  and gave merchants a way to increase engagement and loyalty. It launched in March 2011 as a
  spinoff of SCVNGR and historically ran a developer API for payments, ordering, and loyalty at
  developer.thelevelup.com. LevelUp was acquired by Grubhub in 2018 for $390 million; as of this
  enrichment pass the entire thelevelup.com domain 302-redirects to grubhub.com and the former
  developer.thelevelup.com and api.thelevelup.com subdomains no longer resolve, so there is no
  independent live API surface remaining to catalog. This profile is retained as a historical
  network record of an acquired company.
